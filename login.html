<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Learn Japanese with Raj</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c8102e%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>日</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/login.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        <span class="brand-mark">日</span>
        Learn Japanese with Raj
      </a>
    </div>
  </header>

  <main class="login-main">
    <div class="login-card">
      <h1>Sign in</h1>
      <p class="login-subtitle">Enter your username and password to continue.</p>

      <form id="login-form" autocomplete="off" novalidate>
        <div class="login-field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" autocomplete="username" required />
        </div>
        <div class="login-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required />
        </div>
        <p class="login-error" id="login-error" role="alert"></p>
        <button type="submit" class="login-submit">Sign in</button>
      </form>
    </div>
  </main>

  <script src="assets/js/login.js"></script>
</body>
</html>
